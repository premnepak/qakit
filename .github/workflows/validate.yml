name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate source
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.x'

      - name: Make validate script executable
        run: chmod +x scripts/validate.sh

      - name: Run validation
        run: ./scripts/validate.sh

  playwright:
    # Playwright 1.60.0 supports Ubuntu 24.04, not the 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    name: Playwright tests
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: xvfb-run --auto-servernum npx playwright test

      - name: Check for generated HTML report
        id: report_status
        if: always()
        shell: bash
        run: |
          if [[ -f playwright-report/index.html ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test report artifact
        id: upload_report
        if: always() && steps.report_status.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Add test artifact link to workflow summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          REPORT_READY: ${{ steps.report_status.outputs.ready }}
        shell: bash
        run: |
          {
            if [[ -n "$ARTIFACT_URL" ]]; then
              echo "### Playwright test report"
              echo "- This run's report artifact: [Download report](${ARTIFACT_URL})"
            elif [[ "$REPORT_READY" != "true" ]]; then
              echo "### Playwright test report"
              echo "- No HTML report was generated in this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

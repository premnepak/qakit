<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>QAKit · Text Compare</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px; color: #1a1f2c;
  background: #f5f5f3;
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}
.tc-header {
  background: #1a1f2c; color: #fff; padding: 9px 16px;
  display: flex; align-items: center; gap: 16px; flex-shrink: 0;
}
.tc-logo { display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px; }
.tc-logo-badge { width:22px;height:22px;background:#00e5a0;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#0f141d;font-weight:700;font-size:11px; }
.tc-version { margin-left:auto;font-size:11px;color:rgba(255,255,255,.4); }

.tc-toolbar {
  background:#ececea;border-bottom:1px solid #c7c5bd;
  padding:6px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;
}
.tc-btn { padding:4px 10px;background:#fff;border:1px solid #6b6b6b;border-radius:4px;font-size:11px;color:#1a1f2c;font-weight:500;cursor:pointer; }
.tc-btn:hover { background:#f0f0ee; }
.tc-btn.primary { background:#00e5a0;border-color:#0a6e51;color:#0f141d;font-weight:700; }
.tc-divider { width:1px;height:16px;background:#b4b2a9;margin:0 2px; }
.tc-toggle { display:flex;align-items:center;gap:4px;font-size:10.5px;color:#1a1f2c;font-weight:500;cursor:pointer; }
.tc-toggle input { accent-color:#0a6e51;cursor:pointer; }
.tc-stats { margin-left:auto;font-size:11px;font-weight:500; }
.added   { color:#0a6e51; }
.removed { color:#c0392b; }
.changed { color:#b45309; }

/* Body — two panes side by side, full height */
.tc-body { flex:1;min-height:0;display:flex;overflow:hidden; }

/* Splitter */
.tc-splitter { width:5px;background:#c7c5bd;cursor:col-resize;flex-shrink:0;transition:background .15s; }
.tc-splitter:hover,.tc-splitter.dragging { background:#00e5a0; }

/* Each pane */
.tc-pane { flex:1 1 0;min-width:80px;display:flex;flex-direction:column;overflow:hidden;background:#fff;position:relative; }
.tc-pane:first-of-type { border-right:1px solid #c7c5bd; }
.tc-pane-header { padding:5px 12px;font-size:11px;font-weight:600;flex-shrink:0;color:#fff; }
#tcLeftPane  .tc-pane-header { background:#1a1f2c; }
#tcRightPane .tc-pane-header { background:#0a6e51; }

/* The editable area — textarea + overlay stacked */
.tc-editor { flex:1;min-height:0;position:relative;overflow:hidden; }
.tc-textarea {
  position:absolute;top:0;left:0;right:0;bottom:0;
  border:none;outline:none;resize:none;
  padding:8px 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.6;
  color:#1a1f2c;background:transparent;
  overflow:auto;white-space:pre;
  z-index:2;caret-color:#1a1f2c;
}
/* Diff overlay — must match textarea exactly */
.tc-overlay {
  position:absolute;top:0;left:0;right:0;bottom:0;
  padding:8px 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.6;
  pointer-events:none;
  overflow:hidden;
  white-space:pre;           /* must match textarea */
  z-index:1;
  background:#fff;
  color:#1a1f2c;
}
/* When diff is active, make textarea text transparent so overlay shows */
.tc-textarea.has-diff { color:transparent; }

/* Diff highlight colours — use display:block so full line is highlighted */
.dh-eq   { color:#1a1f2c; }
.dh-add  { background:#d3f0e1;color:#0a6e51;display:block; }
.dh-del  { background:#fcebeb;color:#c0392b;display:block; }
.dh-chg-l{ background:#fcebeb;color:#c0392b;display:block; }
.dh-chg-r{ background:#d3f0e1;color:#0a6e51;display:block; }
.dh-w-del{ background:#f4a8a8; }
.dh-w-add{ background:#97c459; }

/* Minimap — full height right column */
.tc-minimap {
  width:14px;flex-shrink:0;
  background:#f0f0ee;
  border-left:1px solid #c7c5bd;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  align-self:stretch;   /* fill full flex row height */
  flex:0 0 14px;
}
.tc-mini-tick { position:absolute;left:1px;right:1px;height:3px;border-radius:1px; }
.tc-mini-tick.added   { background:#0a6e51; }
.tc-mini-tick.removed { background:#c0392b; }
.tc-mini-tick.changed { background:#b45309; }
.tc-mini-viewport {
  position:absolute;left:0;right:0;
  background:rgba(0,229,160,.2);border:1px solid #0a6e51;
  pointer-events:none;min-height:4px;
}

/* Action column — copy buttons at pane edges facing the splitter */
.tc-actions {
  width:22px;flex-shrink:0;background:#f5f5f3;
  overflow:hidden;position:relative;
}
.tc-actions-right { border-left:1px solid #c7c5bd; }
.tc-actions-left  { border-right:1px solid #c7c5bd; }
.tc-action-btn {
  position:absolute;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  background:#1a1f2c;color:#fff;
  font-size:10px;font-weight:700;cursor:pointer;
  border:none;padding:0;
  height:20px;line-height:20px;
  opacity:0.55;transition:opacity .12s, background .12s;
  width:100%;
}
.tc-action-btn:hover { opacity:1;background:#00e5a0;color:#0f141d; }
.tc-action-btn.selected { opacity:1;background:#185fa5; }

/* Multi-line selection floating bar */
.tc-select-bar {
  position:fixed;z-index:9999;
  background:#1a1f2c;color:#fff;border-radius:6px;
  padding:5px 10px;display:flex;gap:8px;align-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:11px;
  display:none;
}
.tc-select-bar.active { display:flex; }
.tc-select-bar-btn {
  background:#00e5a0;border:none;border-radius:4px;
  padding:4px 10px;color:#0f141d;font-size:10px;font-weight:700;cursor:pointer;
}

/* Flash */
.dh-flash { animation:tcfl 1.5s; }
@keyframes tcfl { 0%,100%{outline:none} 25%{outline:3px solid #00e5a0;outline-offset:-2px} }

/* Line numbers gutter */
.tc-lines {
  width:36px;background:#1a1f2c;color:rgba(255,255,255,.4);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.6;
  padding:8px 4px 8px 0;text-align:right;
  overflow:hidden;flex-shrink:0;user-select:none;
  white-space:pre;
}

/* Jump strip */
.tc-jumpstrip {
  padding:4px 12px;background:#f5f5f3;border-top:1px solid #c7c5bd;
  font-size:10.5px;color:#1a1f2c;flex-shrink:0;display:none;
  flex-wrap:wrap;gap:4px;align-items:center;
}
.tc-jumpstrip.active { display:flex; }
.tc-jump { padding:2px 7px;background:#fff;border:1px solid #c7c5bd;border-radius:4px;cursor:pointer;font-family:monospace;font-size:10px; }
.tc-jump:hover { background:#00e5a0;border-color:#0a6e51;color:#0f141d; }
.tc-jump.added   { color:#0a6e51; }
.tc-jump.removed { color:#c0392b; }
.tc-jump.changed { color:#b45309; }
</style>
</head>
<body>

<header class="tc-header">
  <div class="tc-logo"><span class="tc-logo-badge">QK</span><span>Text Compare</span></div>
  <span class="tc-version">v1.0.1</span>
</header>

<div class="tc-toolbar">
  <label class="tc-toggle"><input type="checkbox" id="tcLive" checked> Live</label>
  <span class="tc-divider"></span>
  <label class="tc-toggle"><input type="checkbox" id="tcIgnoreWs"> Ignore whitespace</label>
  <label class="tc-toggle"><input type="checkbox" id="tcIgnoreCase"> Ignore case</label>
  <label class="tc-toggle"><input type="checkbox" id="tcWordHl" checked> Word highlight</label>
  <span class="tc-divider"></span>
  <button class="tc-btn primary" id="tcCompare">▶ Compare</button>
  <button class="tc-btn" id="tcSwap">⇄ Swap</button>
  <button class="tc-btn" id="tcClear">Clear</button>
  <span class="tc-stats" id="tcStats"></span>
</div>

<div class="tc-body">
  <div class="tc-pane" id="tcLeftPane">
    <div class="tc-pane-header">Original <span style="opacity:.5;font-size:9px">(edit freely)</span></div>
    <div style="display:flex;flex:1;min-height:0;overflow:hidden">
      <div class="tc-lines" id="tcLeftLines"></div>
      <div class="tc-editor" id="tcLeftEditor">
        <div class="tc-overlay" id="tcLeftOverlay"></div>
        <textarea class="tc-textarea" id="tcLeft" spellcheck="false" placeholder="Paste original text here…"></textarea>
      </div>
      <div class="tc-actions tc-actions-right" id="tcLeftActions"></div>
    </div>
  </div>
  <div class="tc-splitter" id="tcSplitter"></div>
  <div class="tc-pane" id="tcRightPane">
    <div class="tc-pane-header">Revised <span style="opacity:.5;font-size:9px">(edit freely)</span></div>
    <div style="display:flex;flex:1;min-height:0;overflow:hidden">
      <div class="tc-actions tc-actions-left" id="tcRightActions"></div>
      <div class="tc-lines" id="tcRightLines"></div>
      <div class="tc-editor" id="tcRightEditor">
        <div class="tc-overlay" id="tcRightOverlay"></div>
        <textarea class="tc-textarea" id="tcRight" spellcheck="false" placeholder="Paste revised text here…"></textarea>
      </div>
    </div>
  </div>
  <div class="tc-minimap" id="tcMinimap"></div>
</div>

<!-- Multi-line selection action bar -->
<div class="tc-select-bar" id="tcSelectBar">
  <span id="tcSelectCount" style="color:rgba(255,255,255,.6);font-size:10px"></span>
  <button class="tc-select-bar-btn" id="tcSelectCopyRight">→ Copy to right</button>
  <button class="tc-select-bar-btn" id="tcSelectCopyLeft">← Copy to left</button>
  <button style="background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:14px" id="tcSelectDismiss">×</button>
</div>

<div class="tc-jumpstrip" id="tcJumpStrip">
  <span style="font-weight:600;color:#555;margin-right:4px">Changes:</span>
  <span id="tcJumps"></span>
</div>

<script src="text-compare.js"></script>
</body>
</html>
